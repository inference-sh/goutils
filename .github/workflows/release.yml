name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Warm Go module proxy
        run: |
          curl -sf "https://proxy.golang.org/github.com/inference-sh/goutils/@v/${GITHUB_REF_NAME}.info" > /dev/null

      - name: Update downstream consumers
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          dispatch() {
            local repo=$1
            echo "Dispatching to $repo..."
            curl -sf -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/actions/workflows/update-dep.yml/dispatches" \
              -d "{\"ref\":\"dev\",\"inputs\":{\"module\":\"github.com/inference-sh/goutils\",\"version\":\"${GITHUB_REF_NAME}\"}}" || true
          }

          dispatch inference-sh/api
          dispatch inference-sh/cli
          dispatch inference-sh/engine
          dispatch inference-sh/uploader
