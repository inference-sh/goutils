name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Warm Go module proxy
        run: |
          curl -sf "https://proxy.golang.org/github.com/inference-sh/goutils/@v/${GITHUB_REF_NAME}.info" > /dev/null

      # Consumers are bumped by `make release` in this repo, which points
      # each checked-out consumer at the new tag and prints what to commit.
      # CI used to dispatch update-dep.yml, which committed and pushed go.mod
      # straight to their dev branches as the bot. Those repos are one shared
      # checkout, so that arrived mid-edit as a surprise commit to rebase past.
      # This workflow publishes the module. It does not author in other repos.
