name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Warm Go module proxy
        run: GONOSUMCHECK= go get github.com/inference-sh/goutils@${GITHUB_REF_NAME}

      - name: Update downstream consumers
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPOS="inference-sh/api inference-sh/cli inference-sh/engine inference-sh/uploader"
          for repo in $REPOS; do
            echo "--- $repo ---"
            gh workflow run update-dep.yml \
              --repo "$repo" \
              --field module=github.com/inference-sh/goutils \
              --field version="$TAG" \
              2>/dev/null || echo "  skipped (no update-dep workflow yet)"
          done
